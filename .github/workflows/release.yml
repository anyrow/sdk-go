# Generated by honey-clients release sync from release.config.ts; the next sync overwrites any edit.
# Publishes the tag sync pushes (or the one given to a manual run) to: go.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, as vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is the version the package publishes
        run: |
          VERSION="${TAG#v}"
          FOUND="$(jq -er '.packages[] | select(.registry == "go") | .version' .honey-generated.json)"
          [ "$FOUND" = "$VERSION" ] || { echo "::error::tag $TAG, but .honey-generated.json holds version $FOUND"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: go serves the version
        run: |
          NAME="$(jq -er '.packages[] | select(.registry == "go") | .name' .honey-generated.json)"
          for _ in $(seq "${LIVE_CHECK_TRIES:-60}"); do
            if curl -fsS -o /dev/null "https://proxy.golang.org/$NAME/@v/$TAG.info"; then echo "go serves $NAME $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::go does not serve $NAME $VERSION; the publish above did not land"
          exit 1
